<svg xmlns="http://www.w3.org/2000/svg" viewBox="-62 -42 126 52" width="630" height="260" role="img" aria-label="Transit bullet car in side view, with a route stripe and station nodes along the body">
  <title>Transit bullet car</title>
  <!--
    Same design as before. Four things were fixed, all of them alignment:

    1. The route stripe ran at y -18.5, straight through the middle of all three
       windows, and the station nodes were filled #1A1F26 so they punched dark holes
       in the white glass. The stripe now runs at y -13, in its own band between the
       window sills (-18) and the body floor (-8), and nothing overlaps anything.
    2. The stripe ended at x 54 and the headlight rect started at x 54, so they fused
       into one shape and the nose read as a pin, not a headlight. The headlight is
       now a separate disc at (52,-21) on the nose face.
    3. The wheels were drawn after the body with r 7.5 at cy -3.5, so their tops
       crossed the floor at y -8 and chopped three notches out of the body outline.
       They are now drawn BEFORE the body, so the silhouette is continuous and the
       wheels emerge from under it.
    4. Nothing shared a vertical. Stripe nodes sat at -29/-7/19 and wheels at
       -34/-5/26. Both now sit on -30/0/30, so the three nodes and the three wheels
       line up in three columns. The glazing also moved 3 left, which evens out a
       15 unit blank tail against the nose.

    The axle was five nested circles plus a bar 13 long, and only the bottom half of
    a wheel is ever visible under the body, so the bar read as a line dropping out of
    the car rather than as a spoke. It is now a rim, one spoke across the inner disc,
    and a hub: symmetric, and it still reads when half of it is hidden.

    Two things that read as transparency: body fill #1A1F26 against stroke #0B0E12
    is a 1.3:1 pair, so the outline was invisible and the car read as a soft blob.
    The body is now one flat fill, no stroke, and the window outlines are gone too.
    The wheel rims were also #0B0E12 filled with a #1A1F26 stroke, which is why they
    dissolved on a dark background.

    Colors are the light-ground livery. For a dark ground swap:
      BODY   #0B0E12 -> #EDEFF2
      GLASS  #F4F4F2 -> #0D1014
      ROUTE  #1B44D9 stays; it measures 8.3 against a near-white body

    Geometry. Origin sits where the car meets the rail, so most y values are negative:
      body      x -56 to 58     roof y -36, floor y -8
      windows   sill y -18, head y -30, raked 6 over 12
      stripe    y -13, x -50 to 50, nodes at -30 / 0 / 30
      axles     y -3, r 6.5, at -30 / 0 / 30
  -->

  <g id="route-train">
    <!-- Axles first, so the body silhouette stays unbroken where they meet it.
         Each axle is a translate group wrapping a .wheel group: putting a rotation
         on the same element as the translate would throw the wheel to the origin. -->
    <g id="wheels">
      <g transform="translate(-30 -3)">
        <g class="wheel">
          <circle r="6.5" fill="#0B0E12" />
          <rect x="-0.8" y="-4.3" width="1.6" height="8.6" fill="#F4F4F2" />
          <circle r="4.3" fill="none" stroke="#F4F4F2" stroke-width="1.7" />
          <circle r="2.4" fill="#1B44D9" />
        </g>
      </g>
      <g transform="translate(0 -3)">
        <g class="wheel">
          <circle r="6.5" fill="#0B0E12" />
          <rect x="-0.8" y="-4.3" width="1.6" height="8.6" fill="#F4F4F2" />
          <circle r="4.3" fill="none" stroke="#F4F4F2" stroke-width="1.7" />
          <circle r="2.4" fill="#1B44D9" />
        </g>
      </g>
      <g transform="translate(30 -3)">
        <g class="wheel">
          <circle r="6.5" fill="#0B0E12" />
          <rect x="-0.8" y="-4.3" width="1.6" height="8.6" fill="#F4F4F2" />
          <circle r="4.3" fill="none" stroke="#F4F4F2" stroke-width="1.7" />
          <circle r="2.4" fill="#1B44D9" />
        </g>
      </g>
    </g>

    <!-- Car body. All four corners rounded now; the tail used to have a 6 unit round
         at the top and a hard 90 at the bottom. -->
    <path
      id="car-body"
      d="M -50 -8 H 48 Q 58 -8 58 -18 C 58 -28 44 -36 28 -36 H -50 Q -56 -36 -56 -30 V -14 Q -56 -8 -50 -8 Z"
      fill="#0B0E12"
    />

    <!-- Glass. Three panes on one rake and one pitch: sills at -18, heads at -30,
         6 units of body between each pane. -->
    <g id="glazing" fill="#F4F4F2">
      <path d="M -41 -18 H -25 L -19 -30 H -35 Z" />
      <path d="M -19 -18 H -3 L 3 -30 H -13 Z" />
      <path d="M 3 -18 H 46 C 46 -24 40 -28 28 -31 H 9 Z" />
    </g>

    <!-- The route line drawn down the side of the car, in its own band below the
         glass. Nodes share the wheels' three verticals. -->
    <g id="side-route">
      <line x1="-50" y1="-13" x2="50" y2="-13" stroke="#1B44D9" stroke-width="2.5" stroke-linecap="round" />
      <g fill="#0B0E12" stroke="#1B44D9" stroke-width="1.5">
        <circle cx="-30" cy="-13" r="3" />
        <circle cx="0" cy="-13" r="3" />
        <circle cx="30" cy="-13" r="3" />
      </g>
      <g fill="#1B44D9">
        <circle cx="-30" cy="-13" r="1.2" />
        <circle cx="0" cy="-13" r="1.2" />
        <circle cx="30" cy="-13" r="1.2" />
      </g>
    </g>

    <!-- Headlight, clear of the stripe and of the cab glass -->
    <circle id="headlight" cx="52" cy="-21" r="3" fill="#1B44D9" />
  </g>
</svg>
